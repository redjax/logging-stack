---
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  ## Monitor Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  ## Monitor Loki itself
  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  ## Optional: scrape exporters on remote infrastructure.
  #  Add machines here as needed, or use file-based discovery.
  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 60s
